# Main config, replacing the Chainguard base image's stock /etc/nginx/nginx.conf.
# Same as stock except: no `user` directive (the master already runs as uid 65532,
# so stock `user nginx;` was ignored with a [warn] on every start), server_tokens
# off globally, and gzip for text assets. Paths below are the image's own:
# /var/log/nginx/*.log link to stdout/stderr, /run is writable by 65532.
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens   off;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/css application/javascript application/json image/svg+xml text/plain;

    include /etc/nginx/conf.d/*.conf;
}
