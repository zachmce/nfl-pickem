server {
    # Rootless nginx (Chainguard nginx, uid 65532) cannot bind ports <1024, so the
    # SPA is served on 8080 inside the container; compose maps host :80 -> :8080.
    listen 8080;
    server_name _;

    # HSTS is intentionally omitted: nginx terminates plain HTTP behind the
    # compose network (no TLS here yet). Add Strict-Transport-Security only once
    # a TLS-terminating edge exists (threat T-t7-04, accepted for now).
    # server_tokens off is set globally in nginx.main.conf.

    root /usr/share/nginx/html;
    index index.html;

    # Baseline security response headers. `always` emits them on error responses
    # too. `merge` (nginx >= 1.29.3) makes a location's own add_header APPEND to
    # these instead of replacing them, so they are written once, here.
    add_header_inherit merge;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https://cdn.discordapp.com https://a.espncdn.com data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'" always;

    # SPA fallback: every unknown path serves index.html so client-side
    # routing works on hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Serve index.html with no-cache so a redeploy's purged content-hashed assets
    # never strand a client holding a stale index (threat T-t7-03). This
    # exact-match block is where the root `/` and every SPA deep-link land via the
    # `index` directive / try_files internal redirect.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Proxy API calls to the FastAPI backend service.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Content-hashed by Vite, so cache for a year. One Cache-Control header:
    # `expires` would emit a second one next to this add_header.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
