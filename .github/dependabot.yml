version: 2
# Each block opens at its own hour (UTC). PRs that open in the same minute race:
# dependabot-automerge.yml merges one, and strict branch protection leaves the
# rest BEHIND, which Dependabot does not rebase.
updates:
  # MUST-HAVE: keeps the workflow SHA pins fresh. Dependabot rewrites the pinned
  # commit SHA and updates the trailing `# vX.Y.Z` comment.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    # Supply-chain defense-in-depth: hold new releases for 5 days before opening
    # a bump PR, so a malicious or broken release has time to be yanked/flagged
    # (e.g. by osv-scanner's MAL- advisories) before we pull it. Applied to the
    # third-party PACKAGE ecosystems only, NOT the docker base images below —
    # those are pinned for CVE freshness and a cooldown would delay security
    # patches.
    cooldown:
      default-days: 5
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Backend Python deps (pyproject + uv.lock). Must be `uv`, not `pip`: the pip
  # block opened zero version-update PRs in its lifetime; only security updates
  # (which auto-detect the ecosystem) ever arrived, as dependabot/uv/backend/*.
  - package-ecosystem: uv
    directory: "/backend"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
    cooldown:
      default-days: 5
    groups:
      uv-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Frontend npm deps.
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
    cooldown:
      default-days: 5
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Base container images (Dockerfile FROM lines). Keeps the pinned base-image
  # digests fresh so a digest pin can't silently go stale — as nginx:1.27-alpine
  # did until the Trivy gate caught it. No update-types filter so pure digest
  # refreshes (same tag, new build) are grouped too, not just semver bumps.
  #
  # Settings on the docker block below (the first two forced by issue #189):
  #
  #   cooldown.exclude ["*"] — Dependabot applies a 3-DAY DEFAULT cooldown even when
  #   no `cooldown:` block exists (dependabot-core #15711, 2026-07-29). Only the
  #   newest digest of a rolling `:latest` tag is ever compared, so an image that
  #   rebuilds more often than the cooldown length is blocked FOREVER — that is
  #   what silently stopped every /backend cgr.dev bump in Aug 2026 (#148 closed
  #   "no longer updatable", then "No update needed" for four weeks). Upstream
  #   #16075 (2026-08-28) happens to fail open for cgr.dev because the registry
  #   sends no Last-Modified; this opt-out does not depend on that.
  #
  #   interval: daily — a weekly cadence lagged a fresh base-OS advisory by up to
  #   seven days (CVE-2026-14456 needed a hand bump one day after a weekly PR).
  #   Docker PRs are merged by dependabot-automerge.yml once CI is green.
  #
  #   directories (one block, one group) — one docker PR per day. Separate
  #   per-directory blocks opened 2-3 PRs at the same minute; auto-merge landed
  #   the first and strict branch protection left the rest BEHIND, which
  #   Dependabot does not rebase (it rebases on conflicts only).
  #   /.clusterfuzzlite (the fuzz-build env, not shipped) rides along so its
  #   Pinned-Dependencies digest pin cannot go stale either.
  - package-ecosystem: docker
    directories:
      - "/backend"
      - "/frontend"
      - "/.clusterfuzzlite"
    schedule:
      interval: daily
      time: "05:00"
    cooldown:
      exclude: ["*"]
    groups:
      docker-images:
        patterns: ["*"]

  # NOTE: no `pip` ecosystem for /.clusterfuzzlite. requirements.txt is a fully
  # hash-pinned, transitive-locked set (uv pip compile --generate-hashes) for
  # `pip --require-hashes`; Dependabot bumps individual `==` lines independently,
  # which breaks coherence (e.g. bumping pydantic-core without pydantic →
  # ResolutionImpossible, PR #28) and isn't caught by PR CI (the fuzz build runs
  # weekly, not on PRs). Regenerate the whole set manually instead (see the header
  # comment in .clusterfuzzlite/requirements.txt). Freshness is immaterial here —
  # it's a throwaway import-only build env, and Scorecard only needs it PINNED.
