# Trivy reads this from the working directory (the repo root in CI) for every
# image scan. Keep each allow-rule to one package path.
allow-rules:
  # The anthropic SDK's docstrings describe an agent's execution principal with a
  # GCP service-account example, which the gcp-service-account rule flags. No key.
  - id: anthropic-sdk-docstrings
    description: anthropic SDK docstrings, not credentials
    path: opt/venv/lib/python3\.[0-9]+/site-packages/anthropic/
